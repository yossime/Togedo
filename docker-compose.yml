services:
  postgres:
    image: postgres:16-alpine
    container_name: togedo-postgres
    environment:
      POSTGRES_USER: togedo
      POSTGRES_PASSWORD: togedo
      POSTGRES_DB: togedo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U togedo']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
